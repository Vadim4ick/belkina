version: '3.9'
services:
  redis:
    image: redis:7.2-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379' # доступен локально
    volumes:
      - redis_data:/data # файлы AOF/RDB на диск
    restart: unless-stopped # автоподъём после перезагрузки

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
    depends_on:
      - redis

  # postgres:
  #   restart: always
  #   image: postgres:15.3-alpine
