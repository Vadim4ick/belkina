query GetHomePage {
  HomePage {
    mainOfferBanner {
      title
      description
      label
      options {
        text
        id
      }
    }

    aboutProjectBanner {
      title
      subtitle
      description

      media {
        ...MediaFragment
      }
    }

    diagnosticTestBanner {
      title
      subtitle
      label
    }

    featuredTest {
      ...TestFragment
    }
  }
}
