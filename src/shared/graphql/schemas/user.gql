mutation CreateUser(
  $email: String!
  $password: String!
  $role: User_role_MutationInput!
  $signupMethod: User_signupMethod_MutationInput!
  $name: String
) {
  createUser(
    data: {
      email: $email
      password: $password
      role: $role
      signupMethod: $signupMethod
      name: $name
    }
  ) {
    id
    email
  }
}

query GetUserByEmail($email: EmailAddress!) {
  Users(where: { email: { equals: $email } }) {
    docs {
      id
      email
      password
      signupMethod
      role

      name
      avatar {
        ...MediaFragment
      }
    }
    totalDocs
  }
}
